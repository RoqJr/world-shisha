# O plano gratuito do Supabase pausa o projeto após 7 dias sem uso.
# Esta tarefa faz uma consulta simples a cada 3 dias para mantê-lo ativo.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco
        run: |
          curl -fsS -X POST "https://hlgnzdsbfdxdfaejulca.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_EuO-oO_V76I5fy7jEipogA_jtmFq8kv" \
            -H "Content-Type: application/json" -d '{}'
